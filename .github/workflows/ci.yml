name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Mark-LVI-main/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 Mark-LVI-main/ --max-line-length=120 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          pip install pytest
          if [ -d "Mark-LVI-main/tests" ]; then
            pytest Mark-LVI-main/tests/ -v --tb=short
          else
            echo "No tests directory found, skipping."
          fi
